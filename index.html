<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Anniversary❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffe6eb;
            font-family: 'Kanit', sans-serif;
            color: #4a0e17;
            position: relative;
        }

        /* Floating Hearts Layer */
        #heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp linear forwards;
            opacity: 0.9;
            filter: drop-shadow(0 2px 5px rgba(255, 105, 180, 0.4));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translateY(-50vh) scale(1.2) rotate(15deg);
            }
            100% {
                transform: translateY(-110vh) scale(1) rotate(-15deg);
                opacity: 0;
            }
        }

        /* Continuous Background Layer for Pages 1-4 (Cover Full Screen) */
        #main-bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('photo6.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            transition: opacity 0.8s ease;
        }

        /* App Container */
        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        /* Scratch Card Area (1:1 Ratio) */
        .scratch-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            transition: opacity 0.6s ease;
            opacity: 1;
        }

        .scratch-area {
            position: relative;
            width: 320px;
            height: 320px;
            max-width: 85vw;
            max-height: 85vw;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            background: #fff;
        }

        .scratch-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.5s ease;
        }

        .scratch-area canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
        }

        /* Final Page 5 Style (Full Screen photo5.png) */
        #page-final {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('photo5.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        #page-final.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- Floating Hearts Layer -->
    <div id="heart-container"></div>

    <!-- Static Background for Scratch Pages -->
    <div id="main-bg-layer"></div>

    <!-- Audio Element -->
    <audio id="bg-music" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <!-- Main Scratch Frame -->
    <div class="app-container">
        <div class="scratch-wrapper" id="scratch-wrapper">
            <div class="scratch-area">
                <img id="reveal-img" src="photo1.jpg" alt="Memory">
                <canvas id="scratch-canvas"></canvas>
            </div>
        </div>
    </div>

    <!-- PAGE 5 (Full Screen photo5.png) -->
    <div id="page-final"></div>

    <script>
        // Audio Setup
        const music = document.getElementById('bg-music');
        window.addEventListener('DOMContentLoaded', () => {
            music.play().catch(() => {
                document.addEventListener('touchstart', () => music.play(), { once: true });
                document.addEventListener('click', () => music.play(), { once: true });
            });
        });

        // Floating Hearts Generator
        const heartContainer = document.getElementById('heart-container');
        const heartEmojis = ['❤️', '💖', '💗', '💓', '💕', '🌸', '✨'];

        function spawnHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            heart.style.fontSize = (Math.random() * 15 + 20) + 'px';
            heartContainer.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 5000);
        }

        let heartInterval = null;
        function startHeartShower() {
            if (!heartInterval) {
                heartInterval = setInterval(spawnHeart, 300);
            }
        }

        function triggerHeartBurst(count = 25) {
            for (let i = 0; i < count; i++) {
                setTimeout(spawnHeart, i * 80);
            }
        }

        // Photos Config
        const photos = ['photo1.jpg', 'photo2.jpg', 'photo3.jpg', 'photo4.jpg'];
        let currentStep = 0;

        const scratchWrapper = document.getElementById('scratch-wrapper');
        const revealImg = document.getElementById('reveal-img');
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const size = 1024;

        canvas.width = size;
        canvas.height = size;

        const overlayImg = new Image();
        overlayImg.src = 'photo.jpg';

        function resetCanvas() {
            ctx.globalCompositeOperation = 'source-over';
            if (overlayImg.complete && overlayImg.naturalWidth !== 0) {
                ctx.drawImage(overlayImg, 0, 0, size, size);
            } else {
                ctx.fillStyle = '#ffb7c5';
                ctx.fillRect(0, 0, size, size);
            }
        }

        overlayImg.addEventListener('load', resetCanvas);

        let isDrawing = false;
        let completed = false;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function scratch(e) {
            if (!isDrawing || completed) return;
            if (e.cancelable) e.preventDefault();

            const pos = getPos(e);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 80, 0, Math.PI * 2);
            ctx.fill();

            checkProgress();
        }

        function checkProgress() {
            if (completed) return;

            const imgData = ctx.getImageData(0, 0, size, size);
            const pixels = imgData.data;
            let transparentPixels = 0;

            for (let i = 3; i < pixels.length; i += 64) {
                if (pixels[i] === 0) transparentPixels++;
            }

            const totalSampled = (pixels.length / 4) / 16;
            const percent = (transparentPixels / totalSampled) * 100;

            if (percent >= 90) {
                completed = true;
                ctx.clearRect(0, 0, size, size);

                if (currentStep === 3) {
                    // Page 4 Completed
                    triggerHeartBurst(35);
                    
                    // Delay 5 seconds on Page 4 before moving to Page 5
                    setTimeout(() => {
                        showFinalPage();
                    }, 5000);
                } else {
                    // Pages 1-3 Completed: Switch smoothly to next photo
                    setTimeout(() => {
                        nextPhoto();
                    }, 1200);
                }
            }
        }

        function nextPhoto() {
            scratchWrapper.style.opacity = '0';

            setTimeout(() => {
                currentStep++;
                revealImg.src = photos[currentStep];
                resetCanvas();
                completed = false;
                
                scratchWrapper.style.opacity = '1';
            }, 600);
        }

        function showFinalPage() {
            document.getElementById('main-bg-layer').style.opacity = '0';
            scratchWrapper.style.opacity = '0';
            
            setTimeout(() => {
                const finalPage = document.getElementById('page-final');
                finalPage.classList.add('active');
                triggerHeartBurst(40);
                startHeartShower();
            }, 800);
        }

        // Scratch Events
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, { passive: false });
        canvas.addEventListener('touchmove', scratch, { passive: false });
        canvas.addEventListener('touchend', () => isDrawing = false);

        // Initial Canvas Load
        resetCanvas();
    </script>
</body>
</html>
